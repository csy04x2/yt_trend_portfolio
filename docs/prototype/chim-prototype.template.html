function overview(vs){let sampled=vs.filter(v=>v.collection_status!=='not_sampled'),rank=sorted(vs,'view_multiple').filter(v=>v.view_multiple!=null),like=vs.filter(v=>v.like_rate_multiple>1.5),comment=vs.filter(v=>v.comment_rate_multiple>1.5);return `<div class="grid">${stat('관측 영상',fmt(vs.length)+'<span class="unit"> 편</span>','채널 전체가 아닌 수집된 영상 범위')}${stat('비교 가능한 영상',fmt(rank.length)+'<span class="unit"> 편</span>','같은 길이 · 비슷한 게시 경과일 · n≥5')}${stat('좋아요율 중앙값',pct(med(vs.map(v=>v.like_rate))),'영상별 좋아요 ÷ 조회의 중앙값')}${stat('댓글 수집',fmt(sum(sampled,'collected_comments'))+'<span class="unit"> 건</span>',sampled.length+'개 영상 · 원댓글과 답글 포함')}</div><div class="two">${panel('조회와 반응은 같은 방향일까?',scatter(vs))}${panel('지금 확인할 관측',`<div class="finding"><span class="badge">조회 대비 좋아요</span><p class="summaryline">좋아요율이 비교군의 1.5배를 넘는 영상 <b>${like.length}편</b></p><button class="link" data-go="videos">영상별 근거 보기 →</button></div><div class="finding"><span class="badge">조회 대비 댓글</span><p>댓글률이 비교군의 1.5배를 넘는 영상 ${comment.length}편. 호응인지 논쟁인지는 이 값만으로 판단하지 않습니다.</p></div><div class="finding"><span class="badge pending">Reaction lift · 싣지 않음</span><p>현재 Reaction 체계(Reaction 10 + Target 5)의 침착맨 판정은 체계를 설계하는 데 쓰였고, 침착맨은 새 채널 검증(Phase 2)에서 제외됐습니다. 검증된 값이 없어 수치로 싣지 않습니다.</p><button class="link" data-go="audience">답글과 시간표기 구간 확인 →</button></div>`)}</div>${panel('비교군보다 조회가 높은 영상',table(rank.slice(0,5)))}${note('발견은 관측된 관계입니다. 길이별 자체 기준으로 정규화했지만 전체 길이 합산 순위가 포맷 우열을 뜻하지는 않습니다. 조회배수는 분할을 가로질러 또래를 고른 임시값입니다(09-15 결정).')}`}
function videos(vs){return `<div class="toolbar"><label>영상 검색<input id="search" placeholder="제목으로 검색" value="${esc(query)}"></label><label>정렬<select id="sort">${[['view_multiple','조회배수 높은 순'],['view_count','조회수 높은 순'],['like_rate_multiple','좋아요율 배수 높은 순'],['comment_rate_multiple','댓글률 배수 높은 순'],['published_at','최신 게시 순']].map(([v,l])=>`<option value="${v}" ${sort===v?'selected':''}>${l}</option>`).join('')}</select></label></div><div id="video-rows">${videoRows(vs)}</div>${note('기준 대비 조회 차이 = 실제 누적 조회 − 비교군 조회 중앙값. 미래 예상 조회수나 예측 모델의 초과성과가 아닙니다.')}`}
function videoRows(vs){let a=vs.filter(v=>v.title.toLowerCase().includes(query.toLowerCase()));a=sort==='published_at'?[...a].sort((a,b)=>b.published_at.localeCompare(a.published_at)):sorted(a,sort);return a.length?table(a):empty('검색 결과가 없습니다.')}
function relations(){let V=scoped(),es=liveEvidence(V).filter(e=>$('#axis').value==='all'||e.length_axis===$('#axis').value);if($('#month').value!=='all')return note('특성 효과는 전체 기간을 기준으로 계산했습니다. 월별 효과는 시간 변화에서 확인하거나 게시 월을 전체 기간으로 바꿔 주세요.');return note('관측 가능한 주말·업로드 간격·코너부터 비교합니다. 개인서사·진정성 점수는 사용하지 않습니다. 비교군을 공유하는 탐색 결과이므로 구간이 0을 지나지 않아도 검증된 성공 공식은 아닙니다.')+es.map(e=>panel(`${esc(e.feature)} <span class="badge">${axisName[e.length_axis]}</span>`,`<p class="summaryline">조회배수 중앙값 차이 <b>${e.estimate>0?'+':''}${fmt(e.estimate,2)}×</b></p><div class="detailsgrid"><div>대상 / 비교 영상<strong>${e.video_n} / ${e.comparison_n}</strong></div><div>탐색 bootstrap 구간<strong>${fmt(e.bootstrap_interval[0],2)} ~ ${fmt(e.bootstrap_interval[1],2)}</strong></div><div>한 영상 제외 시 범위<strong>${fmt(e.leave_one_out_range[0],2)} ~ ${fmt(e.leave_one_out_range[1],2)}</strong></div></div><p class="muted">특성이 있는 영상과 없는 영상의 정규화 성과 차이. 결측 제외 ${e.feature_missing_n}편 · 증거 ${e.evidence_id}</p><details><summary>비교한 실제 영상과 분산 확인</summary><p>대상 분산 ${fmt(e.variance_target,3)} / 비교군 분산 ${fmt(e.variance_comparison,3)} · 한 영상 제거 민감도 ${pct(e.outlier_dependency)}</p>${table(V.filter(v=>e.target_ids.includes(v.video_id)))}</details>`)).join('')||empty('이 범위에는 양쪽 표본 5편 이상인 비교가 없습니다.')}
function audience(vs){let a=vs.filter(v=>v.collection_status!=='not_sampled'),bins=a.flatMap(v=>v.timestamp.bins.map(b=>({v,b}))).sort((a,b)=>b.b.n-a.b.n);return `<div class="grid">${stat('댓글 표본 영상',a.length+' 편','월·길이별 분산 추출 + 기존 2편')}${stat('원댓글 thread',fmt(sum(a,'threads'))+' 개','각 영상의 최신 원댓글 최대 100개')}${stat('수집 답글',fmt(sum(a,'replies_collected'))+' 개','표본 thread의 답글 별도 조회')}${stat('시간표기 댓글',fmt(a.reduce((s,v)=>s+v.timestamp.timestamp_comments,0))+' 건','중복 시각 제거 · 영상 길이 안의 시각')}</div>${note('답글/원댓글은 수집 표본 안의 참여 구조입니다. 답글이 채널 전체 댓글 증가를 견인했다는 의미는 아닙니다.')}<div class="two">${panel('답글 참여가 높은 표본 영상',sorted(a,'reply_rate').slice(0,8).map(v=>`<div class="finding">${vbutton(v)}<p>답글/원댓글 ${mul(v.reply_rate)} · ${v.replies_collected}/${v.threads} · 관측 작성자 ${v.unique_commenters}명</p><small>답글 수집/API 표본 답글 ${pct(v.reply_fetch_coverage)} · 미완료 thread ${v.reply_incomplete_threads}</small></div>`).join('')||empty('수집 표본이 없습니다.'))}${panel('반응이 모인 영상 구간',bins.slice(0,7).map(({v,b})=>`<div class="finding">${vbutton(v)}<p><span class="badge">${clock(b.start)}–${clock(Math.min(b.start+30,v.duration_sec))}</span> 시간표기 댓글 ${b.n}건</p><button class="link" data-video="${v.video_id}">근거 댓글과 구간 그래프 →</button></div>`).join('')||empty('유효한 시간표기 댓글이 없습니다.'))}</div>${panel('Reaction과 감성은 따로 봅니다',`<span class="badge pending">침착맨 Reaction · 설계용</span><p>현재 Reaction 체계는 Reaction 10 + Target 5입니다(09-17 확정, Phase 2 동안 고정). 침착맨 댓글 300건(별도 수집)은 이 체계를 설계하는 데 쓰였으므로 분포와 lift를 검증된 값으로 싣지 않습니다. 아래 sentiment v2는 2개 영상의 과거 댓글 400개이며 Reaction이 아니고, 이번 확장 표본의 판정도 아닙니다.</p>${D.videos.filter(v=>v.sentiment_n&&vs.includes(v)).map(v=>`<div class="finding">${vbutton(v)}<p>긍정 ${v.sentiment.positive||0} · 중립 ${v.sentiment.neutral||0} · 부정 ${v.sentiment.negative||0} / ${v.sentiment_n}건</p><small>${esc(Object.entries(v.sentiment_sources).map(([k,n])=>k+' '+n+'건').join(', '))}</small></div>`).join('')}`)}`}
function clock(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function time(vs){let rows=liveMonthly(vs).filter(r=>($('#axis').value==='all'||r.length_axis===$('#axis').value)&&($('#month').value==='all'||r.month===$('#month').value));return panel('게시 월별 콘텐츠 구성과 관측 성과',`<p class="muted">월별로 게시된 영상의 현재 성과입니다. 게시 후 7일 성과나 월간 조회 증가량이 아닙니다.</p>${rows.filter(r=>r.n).map(r=>`<div class="barrow"><span>${r.month} ${axisName[r.length_axis]}</span><div class="track"><div class="fill" style="width:${r.n/Math.max(...rows.map(x=>x.n))*100}%"></div></div><span>${r.n}편 · ${mul(r.median_multiple)}</span></div>`).join('')}`)+panel('특성 효과의 월별 변화',liveEvidence(scoped()).filter(e=>$('#axis').value==='all'||e.length_axis===$('#axis').value).map(e=>`<div class="finding"><h3>${esc(e.feature)} · ${axisName[e.length_axis]}</h3>${e.time_effect.filter(t=>$('#month').value==='all'||t.month===$('#month').value).map(t=>`<p>${t.month} · 차이 ${fmt(t.estimate,2)}× · n=${t.video_n}/${t.comparison_n} · 구간 ${fmt(t.bootstrap_interval[0],2)}~${fmt(t.bootstrap_interval[1],2)}</p>`).join('')||'<p class="muted">선택 기간에 양쪽 영상 5편 이상을 확보한 월이 없습니다.</p>'}</div>`).join(''))+note('통계 snapshot은 이번에 추가했지만 아직 짧은 관측 간격입니다. 장기 추세·Reaction 변화·change point는 검증을 보류합니다.')}
function trust(vs){let a=vs.filter(v=>v.collection_status!=='not_sampled');return panel('분석 범위와 빠진 데이터',`<div class="grid">${stat('영상 표본 범위',vs.length+' 편','최근 수집 범위이며 채널 전수 아님')}${stat('댓글 영상 coverage',pct(vs.length?a.length/vs.length:null),`${a.length}/${vs.length}편`)}${stat('비교군 부족 등',vs.filter(v=>v.view_multiple==null).length+' 편','미계산 값은 0이 아닌 —로 표시')}${stat('Reaction 판정', '미게재','체계 설계에 쓰인 채널 · Phase 2 검증 제외')}</div><ol>${D.limitations.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`)+panel('영상별 수집 근거 장부',`<div class="tablewrap"><table><thead><tr><th>영상</th><th>수집 댓글</th><th>수집/API 총댓글</th><th>상태</th><th>작성자 결측</th><th>관측 반복 작성자 비중</th></tr></thead><tbody>${a.map(v=>`<tr><td>${vbutton(v)}</td><td>${v.collected_comments}</td><td>${pct(v.collection_to_api_ratio)}</td><td>${esc(v.collection_status)}</td><td>${pct(v.author_missing_rate)}</td><td>${pct(v.observed_repeat_share)}</td></tr>`).join('')}</tbody></table></div><p class="muted">capped: 최신 원댓글 100개에서 중단. 작성자 반복은 35개 표본 영상 안에서의 중복이며 전체 시청자 재방문이 아닙니다.</p>`)+panel('근거 내려받기',`<button class="btn" id="download">현재 전체 근거 JSON 저장</button><p class="muted">관측 실행 ${esc(D.run_id)} · 계산 버전 ${D.version}. 작성자 식별자는 화면용 파일에 포함하지 않습니다. 요약은 계산 결과에 규칙을 적용한 문장이며 별도 LLM 호출을 수행하지 않았습니다. 해석은 09단계에서 할 일이며 아직 구현 전입니다.</p>`)}
function planning(){return panel('다음 기획 회의에서 확인할 것',`<div class="steps">${[['성과가 높은 회차를 직접 확인','영상별 조회배수와 좋아요율 배수가 함께 높은 회차를 열어 소재·구성을 검토합니다.'],['답글이 많은 회차의 대화 맥락 확인','원댓글 대비 답글이 많은 이유가 정보 교환인지, 농담인지, 논쟁인지 원문으로 확인합니다.'],['시간표기 집중 구간 확인','시간표기 댓글의 구간을 재생해 반복되는 장면을 검토합니다. 시청 유지율과 동일시하지 않습니다.'],['후보 특성은 반복 실험으로 검증','같은 길이·관측 시점에서 재확인하며 개인서사·진정성은 필요성이 확인될 때만 추가합니다.']].map(([t,b],i)=>`<label class="step"><input type="checkbox" data-plan="${i}" ${sessionStorage.getItem('chim-plan-'+i)==='1'?'checked':''}><span><h3>${t}</h3>${b}</span></label>`).join('')}</div>`)+panel('구현 진행 상태 · 2026-09-17 기준',`<p><span class="badge">완료</span> 지표 계약 · 35개 영상 댓글/답글 수집 · 300개 통계 갱신 · 비교 성과(임시값) · 특성별 탐색 효과(자리표시자 판정) · timestamp 구간 · 급등 영상 표시 · 실제 화면 연결 · Finding Engine·Runner(개발 분할 전용) · Reaction 10 + Target 5 동결</p><p><span class="badge pending">진행 중</span> Reaction Phase 2 — 새 채널 2개 × 댓글 100개(침착맨·14F·원이 제외) · 수집 전 분석 포함 여부 구분(H3)</p><p><span class="badge pending">일시 정지 · 재개 조건</span> 승인된 사람 특징 목록 · 별도 고정 기준 영상 집합(정식 조회배수) · 실제 코너 다중 소속 복원 · 장기 snapshot 누적 · 변곡 검증 · evidence 기반 해석(09단계)</p>`)}
function showVideo(id){let v=D.videos.find(v=>v.video_id===id);if(!v)return;$('#detail-title').textContent=v.title;let bins=v.timestamp.bins,max=Math.max(1,...bins.map(b=>b.n));$('#detail-body').innerHTML=`<a href="https://www.youtube.com/watch?v=${v.video_id}" target="_blank" rel="noopener">YouTube 영상 열기 ↗</a><p class="muted">게시 ${v.published_at.slice(0,10)} · ${clock(v.duration_sec)} · 관측 ${esc(v.captured_at)} · 게시 후 ${fmt(v.age_days,1)}일</p>${featChips(v,true)}<div class="detailsgrid">${[['조회수',fmt(v.view_count)],['조회배수',mul(v.view_multiple)],['좋아요율 / 배수',pct(v.like_rate)+' / '+mul(v.like_rate_multiple)],['댓글률 / 배수',pct(v.comment_rate)+' / '+mul(v.comment_rate_multiple)],['비교군',v.comparison_n+'편'],['기준 조회수',fmt(v.baseline_views)]].map(([l,n])=>`<div>${l}<strong>${n}</strong></div>`).join('')}</div><p>비교군: 같은 길이 · 게시 경과일 ±${fmt(v.age_tolerance_days,1)}일 · 자기 자신 제외. 기준 대비 조회 차이 ${fmt(v.excess_views)}.</p><details><summary>비교군 영상 ${v.comparison_ids.length}편 확인</summary>${v.comparison_ids.map(id=>`<p>${esc(D.videos.find(v=>v.video_id===id).title)}</p>`).join('')}</details><hr><h3>댓글 참여 구조</h3><p>수집 ${v.collected_comments}건 · 원댓글 ${fmt(v.threads)}개 · 답글 ${fmt(v.replies_collected)}개 · 작성자 ${fmt(v.unique_commenters)}명</p><p>답글/원댓글 ${mul(v.reply_rate)} · 가장 큰 thread ${fmt(v.max_thread_size)}개 · 수집 상태 ${esc(v.collection_status)}</p><h3>시간표기 구간 · 30초 창</h3>${bins.length?bins.map(b=>`<div class="barrow"><a href="https://www.youtube.com/watch?v=${id}&t=${b.start}s" target="_blank" rel="noopener">${clock(b.start)} ↗</a><div class="track"><div class="fill" style="width:${b.n/max*100}%"></div></div><span>${b.n}댓글</span></div><details><summary>구간 근거 댓글</summary>${b.examples.map(x=>`<p class="quote">${esc(x.text)}</p>`).join('')}</details>`).join(''):empty(v.collection_status==='not_sampled'?'이 영상은 댓글 수집 표본에 없습니다.':'수집된 댓글에서 유효한 시간표기를 찾지 못했습니다.')}<p class="muted">60초 창 최대 ${v.timestamp.sensitivity_60s}댓글. 댓글 안의 시각만 추출한 탐색 구간이며 실제 시청 유지율이 아닙니다.</p><h3>조회수 관측 기록</h3>${v.snapshots.map(s=>`<p>${esc(s.captured_at)} · ${fmt(s.view_count)}조회</p>`).join('')}`;$('#detail').showModal()}
function features(vs){let F=D.feature_outcome;if(!F)return empty('급등 영상·특징 결과가 아직 없습니다. backend에서 python -m feature_outcome run --evidence-out 로 붙입니다.');let ax=$('#axis').value,ex=$('#spike').checked,names=F.feature_names||{};let f2=x=>x==null?'-':(+x).toFixed(2),fk=x=>x==null?'-':Math.round(x).toLocaleString('ko-KR');let bar=(label,val,max,text,cls)=>`<div class="barrow"><span title="${esc(label)}">${esc(label)}</span><div class="track"><div class="fill ${cls||''}" style="width:${Math.max(1.5,Math.min(100,val/max*100))}%"></div></div><span>${text}</span></div>`;

let s1=panel('① 급등 영상은 얼마나 튀나요?',`<p class="lead">같은 시기 비슷한 길이의 영상들 중앙값을 <b>1.0배</b>로 놓았을 때, 이 영상들은 그보다 <b>몇 배</b>를 봤는지입니다.</p>${bar('보통 영상',1,mx,'1.0배','base')}${top.map(b=>bar(b.title,b.view_multiple||0,mx,f2(b.view_multiple)+'배')).join('')}<p class="lead">이런 영상이 300편 중 <b>${F.breakouts.length}편</b>입니다. 지우지 않고 표시만 해 둡니다. 상단의 「급등 영상 제외」를 켜면 모든 페이지가 이 영상들을 뺀 값으로 바뀝니다.${ex?' <b>지금 켜져 있습니다.</b>':''}</p>`);
let sh=F.multiple_shifts.filter(s=>ax==='all'||s.axis===ax).slice(0,6),mx2=Math.max(1,...sh.map(s=>Math.max(s.old,s.new)));
let s2=panel('② 급등 영상을 빼면 옆 영상들의 성적이 올라갑니다',`<p class="lead">배수는 「비슷한 영상들의 중앙값」으로 나눈 값입니다. 급등 영상이 그 중앙값을 끌어올리면 <b>평범한 영상이 못 나간 것처럼</b> 보입니다. 빼고 다시 재면 이렇게 됩니다.</p>${sh.map(s=>`<div class="pair"><span title="${esc(s.title)}">${esc(s.title)}</span>${pairTrack(s.old,s.new,mx2)}<span>${f2(s.old)}배 → <b>${f2(s.new)}배</b></span></div>`).join('')}<p class="legend"><i style="background:#c9d3ce"></i>급등 영상 포함 <i style="background:var(--accent)"></i>급등 영상 제외</p>`);
let axes=ax==='all'?['shorts','long']:[ax],axK={shorts:'쇼츠',standard:'일반',long:'롱폼'};
let s3=panel('③ 달마다 보통 영상은 얼마나 봤나요?',`<p class="lead">게시한 달별로 <b>조회수 중앙값</b>입니다. 연한 막대는 전체, 진한 막대는 급등 영상을 뺀 값입니다. 두 막대가 크게 다른 달이 급등 영상이 숫자를 끌어올린 달입니다.</p>${axes.map(a=>{let rows=F.trend.filter(r=>r.axis===a),m3=Math.max(1,...rows.map(r=>r.views_all||0));return `<h3 style="margin:14px 0 4px;font-size:15px">${axK[a]||a}</h3>${rows.map(r=>`<div class="pair"><span>${r.month.slice(5)}월 · ${r.n_ex}편</span>${pairTrack(r.views_all,r.views_ex,m3)}<span>${fk(r.views_ex)}</span></div>`).join('')}`}).join('')}${note('스냅샷이 한 시점뿐이라 성장 곡선이 아닙니다. 최근 달은 아직 조회수가 덜 쌓였습니다. 추이를 보려면 매일 통계를 쌓아야 합니다.')}`);
let rows=F.outcome.filter(r=>r.axis===ax),ok=rows.filter(r=>!r.verdict.some(v=>v.startsWith('셀'))),hold=rows.filter(r=>r.verdict.some(v=>v.startsWith('셀'))),m4=Math.max(0.5,...ok.map(r=>Math.max(Math.abs(r.all.diff||0),Math.abs(r.excluded.diff||0))));
let tag=r=>{if(r.verdict.includes('부호반전'))return ['tag-warn','급등 영상 몇 편이 만든 결과'];if(r.verdict.includes('붕괴'))return ['tag-warn','급등 영상을 빼면 효과가 사라짐'];if(r.verdict.length)return ['tag-hold','한 편에 좌우될 수 있음'];return ['tag-ok','급등 영상을 빼도 그대로']};
let dbar=d=>`<div class="dbar"><div class="neg">${d<0?`<div style="width:${Math.abs(d)/m4*100}%"></div>`:''}</div><div class="pos">${d>0?`<div style="width:${d/m4*100}%"></div>`:''}</div></div>`;
let s4=panel(`④ 어떤 특징이 있는 영상이 더 잘 나갔나요? · ${axK[ax]||'전체'}`,`<p class="lead">특징이 <b>있는</b> 영상과 <b>없는</b> 영상의 조회배수 중앙값 차이입니다. 오른쪽(초록)이면 있는 쪽이 더 나갔고, 왼쪽(주황)이면 덜 나갔습니다. 급등 영상을 뺀 뒤에도 같은 방향이면 믿을 만합니다.</p>${ok.length?ok.map(r=>{let [cls,label]=tag(r),d=r.excluded.diff,dir=d>0?'더':'덜';return `<div class="fcard"><h3>${esc(names[r.feature_id]||r.feature_id)} <span class="badge ${cls}">${label}</span></h3><p class="muted" style="margin:0">이 특징이 있는 영상 ${r.excluded.n1}편은 없는 영상 ${r.excluded.n0}편보다 조회배수가 <b>${f2(Math.abs(d))} ${dir}</b> 나갔습니다 (급등 영상 포함 시 ${f2(r.all.diff)}).</p>${dbar(d)}</div>`}).join(''):empty('이 범위에는 양쪽 4편 이상인 특징이 없습니다.')}${hold.length?`<p class="muted" style="margin-top:14px">표본이 모자라 아직 판단하지 않은 특징: ${hold.map(r=>esc(names[r.feature_id]||r.feature_id)).join(', ')}</p>`:''}${note(F.u_as_control?'<b>지금 판정은 제목만 보고 붙인 임시 판정입니다.</b> 「없음」을 증명할 수 없는 영상을 없는 쪽에 넣었으므로 방향만 읽고 크기는 믿지 마세요. 승인된 사람 특징 목록과 개발용 판정이 아직 없습니다(09-15 점검). 그 판정 파일로 바꾸면 이 경고가 사라집니다.':'판정 파일: '+esc(F.labels_source))}`);
let next=panel('⑤ 다음 — 14F 결과가 오면 · 일시 정지',`<div class="note">09-17 결정으로 영상 특징 작업은 반응 분류 Phase 2 뒤로 일시 정지됐습니다. 아래는 재개할 때의 절차입니다. 승인된 사람 특징 목록과 정식 조회배수가 갖춰지기 전에는 최종 Finding과 봉인 분할 검증을 실행하지 않습니다.</div><div class="steps">${[['14F 사람 판정을 먼저 동결','친구가 보낸 특징 정의와 판정 JSON을 그대로 커밋합니다. LLM 발견은 그 뒤에 돌립니다. 순서가 바뀌면 사람 결과가 LLM에 오염됩니다.'],['14F 급등 영상 표시','같은 규칙으로 표시합니다. 14F에는 리센느 같은 사건이 없으므로 사건 파일은 비워 둡니다. 발견용 90편에 급등 영상이 있으면 다시 자릅니다.'],['같은 채널 안에서 두 판','14F 특징을 전체·제외로 돌립니다. 급등 영상을 빼면 방향이 바뀌는 특징은 탈락입니다.'],['코너와 겹치는 특징 걸러내기','14F 롱폼의 72%가 코너입니다. 특징이 사실 코너 이름(돈슐랭=음식)이면 새 정보가 아닙니다.'],['두 채널 서로 대 보기','침착맨 특징을 14F에, 14F 특징을 침착맨에 서로 적용합니다. 양쪽에서 방향이 같은 특징만 「구조 후보」로 올립니다. 한쪽에만 있으면 그 채널 고유 특성입니다.'],['홀드아웃은 살아남은 특징만, 한 번','구조 후보에 한해 봉인해 둔 영상에서 한 번 확인합니다. 연 뒤에는 정의를 고치지 않습니다.'],['세 번째 채널은 성장 채널로','두 채널 모두 정점 채널입니다. 달마다 조회수가 오르는 중간 규모 채널을 발견용으로 받고, 두 채널은 대조군으로 돌립니다.']].map(([h,b],i)=>`<div class="step"><b>${String(i+1).padStart(2,'0')}</b><div><b>${h}</b><div class="muted">${b}</div></div></div>`).join('')}</div>`);
